# Quant Bot dashboard reverse proxy.
# Keep Streamlit private on localhost and expose only through nginx.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Basic authentication must be enabled before public exposure.
    auth_basic "Quant Bot Dashboard";
    auth_basic_user_file /etc/nginx/.htpasswd-quant-bot-dashboard;

    # Explicitly public, read-only mobile dashboard requested by the owner.
    # The desktop route below remains protected by HTTP Basic Auth.
    location /mobile/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8502;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Separate protected, read-only dashboard for the isolated $300 paper trial.
    # It inherits the server-level Basic Auth; never disable auth here.
    location /trial/ {
        proxy_pass http://127.0.0.1:8503;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Separate protected phone view for the same isolated $300 paper trial.
    # It inherits Basic Auth and cannot read the original dashboard account.
    location /trial-mobile/ {
        proxy_pass http://127.0.0.1:8504;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for Streamlit websocket support.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
